server:
  address: 0.0.0.0
  port: ${SERVER_PORT:8084}
  forward-headers-strategy: framework
  max-http-request-header-size: 32KB

spring:
  main:
    allow-bean-definition-overriding: true
  application:
    name: ${SPRING_APPLICATION_NAME:gateway}

  cloud:
    gateway:

      # ✅ CORS — must be here on the gateway, NOT on individual microservices
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            allowedHeaders: "*"
            allowCredentials: false    # must be false when allowedOrigins is "*"
            maxAge: 3600

      discovery:
        locator:
          enabled: true
          lower-case-service-id: true     # lb://securityservice, lb://hrservice, ...
      routes:
        - id: security-service
          uri: lb://security-service
          predicates:
            - Path=/api/security/**, /oauth2/**, /jwks/**
        - id: oilproductionservice
          uri: lb://oilproductionservice
          predicates:
            - Path=/api/production/**
        - id: financeservice
          uri: lb://financeservice
          predicates:
            - Path=/api/finance/**
        - id: hrService
          uri: lb://hrService
          predicates:
            - Path=/api/hr/**
        - id: abiooc-inventaire
          uri: lb://abiooc-inventaire
          predicates:
            - Path=/api/inventaire/**
        - id: osm-producion
          uri: lb://PRODUCTION-SERVICE
          predicates:
            - Path=/api/ordreConditionement/**, /api/search/**

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OAUTH2_ISSUER_URI:http://localhost:8088}
          jwk-set-uri: ${OAUTH2_JWK_SET_URI:http://localhost:8088/oauth2/jwks}

#  FIXED: DEBUG logging so you can see requests arriving and being routed
logging:
  level:
    com.osm.gateway: DEBUG
    org.springframework.cloud.gateway: DEBUG       # shows routing decisions
    reactor.netty.http.server: DEBUG               # shows raw incoming requests
    org.springframework.security: DEBUG            # shows auth filter decisions
    org.springframework.web: DEBUG
    com.netflix.discovery: WARN                    # eureka is noisy, keep WARN

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}

  instance:
    prefer-ip-address: true
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always